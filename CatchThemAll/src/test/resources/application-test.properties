# Test profile: in-memory database so the context boots without the Docker Postgres instance.
spring.datasource.url=jdbc:h2:mem:catchthemall;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# The gRPC channel is created lazily, so no facial-recognition server is required for these tests.
spring.grpc.client.channels.user-service.address=localhost:19090
spring.grpc.client.channels.user-service.secure=false
