spring.application.name=CatchThemAll

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Dirección y puerto del servidor gRPC externo
spring.grpc.client.channels.user-service.address=localhost:9090
# Deshabilitar seguridad TLS solo para desarrollo local (plaintext)
spring.grpc.client.channels.user-service.secure=false