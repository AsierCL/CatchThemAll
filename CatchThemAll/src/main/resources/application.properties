spring.application.name=CatchThemAll

#PostgreSQL en Supabase
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Dirección y puerto del servidor gRPC externo
spring.grpc.client.channels.user-service.address=static://localhost:9090
# Deshabilitar seguridad TLS solo para desarrollo local (plaintext)
spring.grpc.client.channels.user-service.secure=false

# Jackson: un campo sin @JsonView no se serializa cuando hay una vista activa
spring.jackson.mapper.default-view-inclusion=false

# JWT
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
security.jwt.expiration-minutes=15
jwt.refreshExpirationMs=86400000

# Cache (duraciones ISO-8601). Son la unica fuente: las usan CacheConfig y OpenApiConfig.
cache.famous.ttl=PT5M
cache.ranking.ttl=PT1H
cache.captures.ttl=PT15M

# Tamaño máximo de cada archivo
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo de la petición multipart completa
spring.servlet.multipart.max-request-size=12MB

# OpenAPI / Swagger UI (siempre expuesto, tambien en produccion)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

#Cache
#logging.level.org.springframework.cache=TRACE
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Circuit Breaker: reconocimiento facial
resilience4j.circuitbreaker.instances.facialRecognition.registerHealthIndicator=true

# Ventana deslizante
resilience4j.circuitbreaker.instances.facialRecognition.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.facialRecognition.slidingWindowSize=20
resilience4j.circuitbreaker.instances.facialRecognition.minimumNumberOfCalls=10

# Umbral de fallos
resilience4j.circuitbreaker.instances.facialRecognition.failureRateThreshold=50

# Tiempo en estado OPEN
resilience4j.circuitbreaker.instances.facialRecognition.waitDurationInOpenState=10s

# Llamadas permitidas en HALF_OPEN
resilience4j.circuitbreaker.instances.facialRecognition.permittedNumberOfCallsInHalfOpenState=5

# Transición automática a HALF_OPEN
resilience4j.circuitbreaker.instances.facialRecognition.automaticTransitionFromOpenToHalfOpenEnabled=true

# ========================================
# ACTUATOR
# ========================================

# Exponer endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Mostrar detalles del estado de salud
management.endpoint.health.show-details=always

# Habilitar indicadores de Circuit Breaker
management.health.circuitbreakers.enabled=true