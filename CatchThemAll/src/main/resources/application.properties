spring.application.name=CatchThemAll

# PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://localhost:7777/catchthemall
spring.datasource.username=usuario
spring.datasource.password=password123

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Dirección y puerto del servidor gRPC externo
spring.grpc.client.channels.user-service.address=localhost:9090
# Deshabilitar seguridad TLS solo para desarrollo local (plaintext)
spring.grpc.client.channels.user-service.secure=false

# Jackson: un campo sin @JsonView no se serializa cuando hay una vista activa
spring.jackson.mapper.default-view-inclusion=false

# JWT
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
security.jwt.expiration-minutes=15
jwt.refreshExpirationMs=86400000

# Tamaño máximo de cada archivo
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo de la petición multipart completa
spring.servlet.multipart.max-request-size=12MB

# OpenAPI / Swagger UI (siempre expuesto, tambien en produccion)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true