spring.application.name=CatchThemAll

# PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://localhost:7777/catchthemall
spring.datasource.username=usuario
spring.datasource.password=password123

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Dirección y puerto del servidor gRPC externo
spring.grpc.client.channels.user-service.address=localhost:9090
# Deshabilitar seguridad TLS solo para desarrollo local (plaintext)
spring.grpc.client.channels.user-service.secure=false

# JWT
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
security.jwt.expiration-minutes=15

# Tamaño máximo de cada archivo
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo de la petición multipart completa
spring.servlet.multipart.max-request-size=12MB