# Perfil de build: lo usa springdoc-openapi-maven-plugin (`./mvnw verify`) para arrancar la
# aplicacion, pedirle /v3/api-docs y escribir docs/openapi.json. Levanta una base H2 en memoria
# y desactiva el soporte de docker-compose para no depender del Postgres de desarrollo ni del
# servicio gRPC de reconocimiento facial.
spring.docker.compose.enabled=false

server.port=18080

spring.datasource.url=jdbc:h2:mem:openapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.grpc.client.channels.user-service.address=localhost:19090
spring.grpc.client.channels.user-service.secure=false
