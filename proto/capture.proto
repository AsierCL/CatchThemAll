syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpc";

service CaptureService {
    rpc identify(CaptureIdentifyRequest) returns (CaptureIdentifyResponse);
}

message CaptureIdentifyRequest {
    bytes image = 1;
    string name = 2;
}

message CaptureIdentifyResponse {
    double similarity = 1;
}